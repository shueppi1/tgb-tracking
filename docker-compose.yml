services:
  mongo:
    # Pinned: MongoDB >= 5.0 and >= 4.4.19 require ARMv8.2-A, which the ARM host does not
    # implement (SERVER-71772). 4.4.18 is the last build that runs there.
    image: mongo:4.4.18
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # 4.4 ships the legacy `mongo` shell; `mongosh` only exists from 5.0 on.
      test: ["CMD", "mongo", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/tgb
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      TOKEN_MAX_AGE: ${TOKEN_MAX_AGE:-2592000}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      # Loopback by default: a reverse proxy (Caddy) on this host terminates TLS.
      # Set WEB_BIND=0.0.0.0 in .env to reach the app directly from the LAN.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  mongo-data:
